<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <!-- Nav logo: geometric P mark + wordmark, for dark navy backgrounds -->

  <!-- P mark block -->
  <rect x="0" y="0" width="48" height="48" rx="3" fill="#0f1e3d"/>
  <polygon points="36,0 48,0 48,12" fill="#D4A843" opacity="0.85"/>
  <rect x="11" y="10" width="6" height="28" fill="white"/>
  <path d="M17 10 Q35 10 35 21 Q35 32 17 32" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <rect x="0" y="48" width="48" height="2.5" fill="#D4A843"/>

  <!-- Thin divider -->
  <line x1="62" y1="6" x2="62" y2="45" stroke="#D4A843" stroke-width="1" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="76" y="27"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="19" font-weight="900"
        fill="white"
        letter-spacing="0.8">PROJECT MANAGEMENT</text>
  <text x="76" y="47"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="19" font-weight="900"
        fill="white"
        letter-spacing="0.8">EXCELLENCE CENTRE</text>

  <!-- Gold sub-rule -->
  <line x1="76" y1="52" x2="398" y2="52" stroke="#D4A843" stroke-width="1" opacity="0.45"/>

  <!-- Tagline -->
  <text x="77" y="60"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7" fill="#D4A843"
        letter-spacing="2.5" font-style="italic">WHERE PROJECT LEADERS ARE MADE</text>
</svg>
