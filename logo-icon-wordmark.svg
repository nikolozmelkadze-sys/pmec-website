<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72">
  <!-- Version 3: Refined icon + wordmark — modern, minimal -->

  <!-- Icon: geometric square with P and gold accent -->
  <rect x="0" y="0" width="56" height="56" rx="4" fill="#1A2F5A"/>
  <!-- Gold top-right accent -->
  <polygon points="42,0 56,0 56,14" fill="#D4A843" opacity="0.9"/>
  <!-- P stem -->
  <rect x="14" y="12" width="7" height="32" fill="white"/>
  <!-- P bowl — clean arc -->
  <path d="M21 12 Q42 12 42 24 Q42 36 21 36" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Gold bottom rule on icon -->
  <rect x="0" y="56" width="56" height="3" fill="#D4A843"/>

  <!-- Divider -->
  <line x1="72" y1="8" x2="72" y2="51" stroke="#D4A843" stroke-width="1" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="88" y="33"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="22" font-weight="900"
        fill="white"
        letter-spacing="1">PROJECT MANAGEMENT</text>
  <text x="88" y="56"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="22" font-weight="900"
        fill="white"
        letter-spacing="1">EXCELLENCE CENTRE</text>

  <!-- Tagline row -->
  <text x="89" y="70"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8" fill="#D4A843"
        letter-spacing="3" font-style="italic">WHERE PROJECT LEADERS ARE MADE &nbsp;·&nbsp; TBILISI, GEORGIA</text>
</svg>
